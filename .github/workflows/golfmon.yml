# 골프몬 양도(국내 30일치, 14일에 한 번)·해외 투어 목록, 카카오골프 공개 요약(7일에 한 번)을 서울 서버(servers/golfmon, 플레이라이트)로 받아 저장한다.
# Firecrawl 은 쓰지 않는다. 매일 돌지만 저장본이 14일 안 됐으면 국내는 건너뛴다. 앱 게시는 04:30 골프 작업이 한다.
name: 골프몬 수집

on:
  workflow_dispatch:
    inputs:
      force:
        description: '저장본이 새것이어도 30일치를 지금 새로 받기(1)'
        required: false
        default: ''
  schedule:
    - cron: '30 18 * * *' # 매일 한국 시간 03:30

permissions:
  contents: write

concurrency:
  group: golfmon
  cancel-in-progress: false

jobs:
  golfmon:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 골프몬 받기 (서울 서버)
        env:
          GOLF_ONLY_GM: '1'
          KR_BROWSER_TOKEN: ${{ secrets.KR_BROWSER_TOKEN }}
          GOLF_GM_FORCE: ${{ github.event.inputs.force }}
        run: node tools/golf/collect.mjs
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/golf/data/golfmon-dom.json tools/golf/data/golfmon-abroad.json tools/golf/data/kakao-golf.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -m "골프몬 자료 갱신 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
