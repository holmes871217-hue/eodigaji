# 매일 한 번 실제 데이터를 다시 모아 앱에 반영한다.
# 키는 저장소 Settings > Secrets 에 들어 있고, 파일이나 기록에는 남지 않는다.
name: 데이터 매일 갱신

on:
  schedule:
    - cron: '0 20 * * *' # 매일 한국 시간 새벽 5시 (UTC 20시)
  workflow_dispatch: # Actions 화면에서 직접 실행도 가능

permissions:
  contents: write
  pages: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 데이터 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: node tools/collect.mjs

      - name: 저장하고 앱에 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
            exit 0
          fi
          git commit -m "데이터 자동 갱신 $(TZ=Asia/Seoul date +%F)"
          git push origin HEAD:main
          git push origin "$(git subtree split --prefix app HEAD)":refs/heads/gh-pages --force
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
