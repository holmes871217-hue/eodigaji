# 매일 한 번 실제 데이터를 다시 모아 앱에 반영한다.
# 키는 저장소 Settings > Secrets 에 들어 있고, 파일이나 기록에는 남지 않는다.
name: 데이터 매일 갱신

on:
  schedule:
    - cron: '0 20 * * *' # 매일 한국 시간 새벽 5시 (UTC 20시)
  workflow_dispatch: # Actions 화면에서 직접 실행도 가능

permissions:
  contents: write
  pages: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 데이터 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: node tools/collect.mjs

      - name: 빠진 장소 확인 (tools/must-have.mjs 기준)
        continue-on-error: true # 빠져 있어도 게시는 계속하되, 실행 화면에 경고가 남는다
        run: node tools/check-coverage.mjs

      - name: 장소 신뢰도 메타 기록 (출처·최초 발견일·최근 확인일·확인 여부)
        run: node tools/stamp-meta.mjs

      - name: 핫플 분류 (신규 발견·급상승·인기 유지·숨은 명소·관심 감소)
        run: node tools/classify-hot.mjs

      - name: 전국 지역 트렌드 점수 (시·군·구별)
        run: node tools/region-trends.mjs

      - name: 사이트 점검 (깨진 파일 주소·맨 앞 슬래시 경로·서비스 워커 목록)
        run: node tools/check-site.mjs # 문제가 있으면 여기서 멈춰 게시하지 않는다

      - name: 같은 장소가 목록에 두 번 나오는지 점검 (app/js/data/dedupe.js 규칙)
        run: node tools/check-dupes.mjs # 겹치는 장소가 있으면 여기서 멈춰 게시하지 않는다

      - name: 개인 취향·행동 규칙 점검 (새 저장 키만 쓰는지, 숨김·평가 반영)
        run: node tools/check-taste.mjs

      - name: 여행 코스 생성 규칙 점검 (시간 안·겹침 없음·영업시간 지어내지 않음)
        run: node tools/check-course.mjs

      - name: 추천 점수 규칙 점검 (이동시간 한도가 길수록 거리 영향이 줄어드는지)
        run: node tools/check-scoring.mjs

      - name: 저장하고 앱에 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
            exit 0
          fi
          git commit -m "데이터 자동 갱신 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main # 수집 중에 main이 바뀌었어도 데이터 커밋이 밀리지 않게
          git push origin HEAD:main
          git push origin "$(git subtree split --prefix app HEAD)":refs/heads/gh-pages --force
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
