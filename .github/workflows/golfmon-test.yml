# 미리보기용(사이트 게시 안 함): 작업 브랜치에서 골픽 자료를 전부 모아 작업 브랜치에만 저장한다.
# 다시 실행: 2026-11-23 점검 목록 수정
name: 골픽 미리보기 수집
on:
  workflow_dispatch:
  push:
    branches: [ccr-c3b867fc-1eymmm]
    paths: [.github/workflows/golfmon-test.yml]
permissions:
  contents: write
concurrency:
  group: golf
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 규칙 점검
        run: node tools/check-golf.mjs
      - name: 골픽 자료 수집
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node tools/golf/collect.mjs
      - name: 수집 결과 점검
        run: node tools/check-golf.mjs
      - name: 작업 브랜치에만 저장 (사이트 게시 안 함)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/golf.json tools/golf/data
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -m "골픽 미리보기 자료 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -X theirs origin ccr-c3b867fc-1eymmm
          git push origin HEAD:ccr-c3b867fc-1eymmm
